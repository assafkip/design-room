<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margin</title>
<style>
:root{--ink:#1a1a17;--paper:#f7f4ec;--line:#d8d2c4;--act:#b4452f}
*{box-sizing:border-box}
body{font-family:Georgia,"Times New Roman",serif;background:var(--paper);color:var(--ink);margin:0;line-height:1.4}
header{max-width:720px;margin:0 auto;padding:64px 24px}
h1{font-size:52px;font-weight:700;letter-spacing:-.02em;margin:0 0 16px}
p{font-size:19px;max-width:48ch;margin:0 0 28px}
a.cta{display:inline-block;background:var(--act);color:var(--paper);padding:14px 22px;text-decoration:none;font-weight:700;border:2px solid var(--ink)}
nav{border-bottom:1px solid var(--line);padding:16px 24px;font-size:15px;display:flex;gap:24px;max-width:720px;margin:0 auto}
</style></head><body>
<nav><strong>Margin</strong><a href="#">Docs</a><a href="#">Pricing</a></nav>
<header>
<h1>Write in the margins of everything you read.</h1>
<p>Highlight a line in any article, book, or PDF. Margin keeps the note, the source, and the date in one place you actually return to.</p>
<a class="cta" href="#start">Start — paste a link</a>
</header>
</body></html>
